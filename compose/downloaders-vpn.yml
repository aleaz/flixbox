# VPN-mode BitTorrent via Gluetun.
# Included when FLIXBOX_MODE=vpn (see root compose.yaml).
# Servarr / Decluttarr download client: http://qbittorrent:8080 (alias on Gluetun — ADR 0014)
#
# Never attach *arr, Seerr, or Jellyfin to Gluetun's network namespace.
#
# qBittorrent WebUI: enable "Bypass authentication for clients on localhost"
# so Gluetun port-forward hooks can call the WebAPI on 127.0.0.1:8080.

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: flixbox-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-UTC}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?set VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      OPENVPN_CUSTOM_CONFIG: ${OPENVPN_CUSTOM_CONFIG:-}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      SERVER_CITIES: ${SERVER_CITIES:-}
      SERVER_REGIONS: ${SERVER_REGIONS:-}
      BLOCK_IPV6: ${BLOCK_IPV6:-on}
      DOT: ${DOT:-on}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
      # Include flixbox_net so *arr/Decluttarr can reach qBit WebUI (ADR 0002).
      # Append LAN CIDR in .env if needed: 172.30.42.0/24,192.168.1.0/24
      FIREWALL_OUTBOUND_SUBNETS: ${FIREWALL_OUTBOUND_SUBNETS:-172.30.42.0/24}
      # Update qBittorrent listen port when the provider assigns a forwarded port
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
        "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
        "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
    volumes:
      - ${CONFIG_DIR:?set CONFIG_DIR}/gluetun:/gluetun
    ports:
      - ${QBITTORRENT_PORT:-8080}:8080
      - ${QBITTORRENT_BT_PORT:-6881}:${QBITTORRENT_BT_PORT:-6881}
      - ${QBITTORRENT_BT_PORT:-6881}:${QBITTORRENT_BT_PORT:-6881}/udp
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      flixbox_net:
        aliases:
          - qbittorrent
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: flixbox-qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      UMASK: ${UMASK:-002}
      WEBUI_PORT: 8080
      TORRENTING_PORT: ${QBITTORRENT_BT_PORT:-6881}
      FLIXBOX_QBIT_FORCE_PATHS: ${FLIXBOX_QBIT_FORCE_PATHS:-false}
    volumes:
      - ${CONFIG_DIR:?set CONFIG_DIR}/qbittorrent:/config
      - ${CONFIG_DIR:?set CONFIG_DIR}/qbittorrent-cont-init:/custom-cont-init.d:ro
      # Post-start loop: keep BitTorrent bound to tun0 (ADR 0002). cont-init alone is rewritten by qBit.
      - ${CONFIG_DIR:?set CONFIG_DIR}/qbittorrent-custom-services:/custom-services.d:ro
      - ${DATA_DIR:?set DATA_DIR}:/data
    # WebUI readiness (shared Gluetun netns) — peers wait via depends_on service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v2/app/version >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    stop_grace_period: 60s
