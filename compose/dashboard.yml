# Homepage dashboard + always-on docker-socket-proxy (ADR 0022).

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: flixbox-docker-socket-proxy
    environment:
      CONTAINERS: 1
      INFO: 1
      NETWORKS: 1
      SERVICES: 0
      TASKS: 0
      POST: 0
      DELETE: 0
      EXEC: 0
      IMAGES: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s
    networks:
      - flixbox_net

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.2.0
    container_name: flixbox-homepage
    environment:
      TZ: ${TZ:-UTC}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost:3000,127.0.0.1:3000}
    volumes:
      - ${CONFIG_DIR}/homepage:/app/config
      - ${CONFIG_DIR}/homepage/images:/app/public/images:ro
      - ${DATA_DIR}:/data:ro
    ports:
      - ${HOMEPAGE_PORT:-3000}:3000
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - flixbox_net
