# Homepage dashboard (+ optional docker-socket-proxy).

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: flixbox-docker-socket-proxy
    profiles: ["socket-proxy"]
    environment:
      CONTAINERS: 1
      INFO: 1
      NETWORKS: 1
      SERVICES: 0
      TASKS: 0
      POST: 0
      DELETE: 0
      EXEC: 0
      IMAGES: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    stop_grace_period: 10s
    networks:
      - flixbox_net

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.1.2
    container_name: flixbox-homepage
    environment:
      TZ: ${TZ:-UTC}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost:3000,127.0.0.1:3000}
    volumes:
      - ${CONFIG_DIR}/homepage:/app/config
      - ${DATA_DIR}:/data:ro
    ports:
      - ${HOMEPAGE_PORT:-3000}:3000
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - flixbox_net
