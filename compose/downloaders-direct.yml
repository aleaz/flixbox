# Direct-mode BitTorrent (no VPN).
# Profile: direct
# Servarr / Decluttarr download client: http://qbittorrent:8080
#
# Configure qBittorrent save paths (first WebUI login):
#   Default: /data/torrents
#   Incomplete: /data/torrents/incomplete
#   Optional categories under /data/torrents/movies and /data/torrents/tv

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: flixbox-qbittorrent
    profiles: ["direct"]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      UMASK: ${UMASK:-002}
      WEBUI_PORT: 8080
      TORRENTING_PORT: ${QBITTORRENT_BT_PORT:-6881}
    volumes:
      - ${CONFIG_DIR:?set CONFIG_DIR}/qbittorrent:/config
      - ${DATA_DIR:?set DATA_DIR}:/data
    ports:
      - ${QBITTORRENT_PORT:-8080}:8080
      - ${QBITTORRENT_BT_PORT:-6881}:${QBITTORRENT_BT_PORT:-6881}
      - ${QBITTORRENT_BT_PORT:-6881}:${QBITTORRENT_BT_PORT:-6881}/udp
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - flixbox_net
