# Direct-mode BitTorrent (no VPN).
# Included when FLIXBOX_MODE=direct (see root compose.yaml).
# Servarr / Decluttarr download client: http://qbittorrent:8080
#
# Paths/WebUI: linuxserver runs /custom-cont-init.d + /custom-services.d (not under /config).
# init installs cont-init paths script + webui-contract custom-service (ADR 0019).

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    container_name: flixbox-qbittorrent
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      UMASK: ${UMASK:-002}
      WEBUI_PORT: 8080
      TORRENTING_PORT: ${QBITTORRENT_BT_PORT:-6881}
      FLIXBOX_QBIT_FORCE_PATHS: ${FLIXBOX_QBIT_FORCE_PATHS:-false}
      # webui-contract custom-service (ADR 0019) — same creds as Decluttarr/configure
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
    volumes:
      - ${CONFIG_DIR:?set CONFIG_DIR}/qbittorrent:/config
      - ${CONFIG_DIR:?set CONFIG_DIR}/qbittorrent-cont-init:/custom-cont-init.d:ro
      - ${CONFIG_DIR:?set CONFIG_DIR}/qbittorrent-custom-services:/custom-services.d:ro
      - ${DATA_DIR:?set DATA_DIR}:/data
    ports:
      - ${FLIXBOX_ADMIN_BIND_IP:-0.0.0.0}:${QBITTORRENT_PORT:-8080}:8080
      - ${QBITTORRENT_BT_PORT:-6881}:${QBITTORRENT_BT_PORT:-6881}
      - ${QBITTORRENT_BT_PORT:-6881}:${QBITTORRENT_BT_PORT:-6881}/udp
    healthcheck:
      # WebUI login page — API /app/version returns 403 without auth when LocalHostAuth=false
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - flixbox_net
