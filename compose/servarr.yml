# Servarr core + Byparr. Download client host: qbittorrent (ADR 0014).
# Auth: profile-driven (ADR 0015) — FLIXBOX_ARR_AUTH_* from .env; API keys for configure.

services:
  # Servarr AUTH: API keys + profile (trusted vs shared). LAN Docker —
  # do not publish *arr to WAN without reverse-proxy auth (see docs/user/13-access-profiles.md).
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: flixbox-prowlarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      UMASK: ${UMASK:-002}
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY:-}
      PROWLARR__AUTH__METHOD: ${FLIXBOX_ARR_AUTH_METHOD:-External}
      PROWLARR__AUTH__REQUIRED: ${FLIXBOX_ARR_AUTH_REQUIRED:-DisabledForLocalAddresses}
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    ports:
      - ${FLIXBOX_ADMIN_BIND_IP:-0.0.0.0}:${PROWLARR_PORT:-9696}:9696
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - flixbox_net

  byparr:
    image: ghcr.io/thephaseless/byparr:3.0.4
    container_name: flixbox-byparr
    environment:
      TZ: ${TZ:-UTC}
    ports:
      # shared → 127.0.0.1 only (ADR 0015 phase 2); Prowlarr still uses http://byparr:8191
      - ${FLIXBOX_ADMIN_BIND_IP:-0.0.0.0}:${BYPARR_PORT:-8191}:8191
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - flixbox_net

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0
    container_name: flixbox-radarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      UMASK: ${UMASK:-002}
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY:-}
      RADARR__AUTH__METHOD: ${FLIXBOX_ARR_AUTH_METHOD:-External}
      RADARR__AUTH__REQUIRED: ${FLIXBOX_ARR_AUTH_REQUIRED:-DisabledForLocalAddresses}
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${DATA_DIR}:/data
    ports:
      - ${FLIXBOX_ADMIN_BIND_IP:-0.0.0.0}:${RADARR_PORT:-7878}:7878
    depends_on:
      qbittorrent:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - flixbox_net

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: flixbox-sonarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      UMASK: ${UMASK:-002}
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY:-}
      SONARR__AUTH__METHOD: ${FLIXBOX_ARR_AUTH_METHOD:-External}
      SONARR__AUTH__REQUIRED: ${FLIXBOX_ARR_AUTH_REQUIRED:-DisabledForLocalAddresses}
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${DATA_DIR}:/data
    ports:
      - ${FLIXBOX_ADMIN_BIND_IP:-0.0.0.0}:${SONARR_PORT:-8989}:8989
    depends_on:
      qbittorrent:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - flixbox_net

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: flixbox-bazarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      UMASK: ${UMASK:-002}
    volumes:
      - ${CONFIG_DIR}/bazarr:/config
      - ${DATA_DIR}:/data
    ports:
      - ${FLIXBOX_ADMIN_BIND_IP:-0.0.0.0}:${BAZARR_PORT:-6767}:6767
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - flixbox_net
