# Servarr core + Byparr. Download client host: qbittorrent (ADR 0014).
# Auth: External + API keys from .env (ADR 0005) — LAN only; do not expose *arr to WAN.

services:
  # Servarr AUTH: External + pre-seeded API keys (ADR 0005). LAN Docker only —
  # do not publish these ports to the public internet without reverse-proxy auth.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: flixbox-prowlarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      UMASK: ${UMASK:-002}
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY:-}
      PROWLARR__AUTH__METHOD: External
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    ports:
      - ${PROWLARR_PORT:-9696}:9696
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - flixbox_net

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: flixbox-byparr
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - ${BYPARR_PORT:-8191}:8191
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - flixbox_net

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: flixbox-radarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      UMASK: ${UMASK:-002}
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY:-}
      RADARR__AUTH__METHOD: External
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${DATA_DIR}:/data
    ports:
      - ${RADARR_PORT:-7878}:7878
    depends_on:
      qbittorrent:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - flixbox_net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: flixbox-sonarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      UMASK: ${UMASK:-002}
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY:-}
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${DATA_DIR}:/data
    ports:
      - ${SONARR_PORT:-8989}:8989
    depends_on:
      qbittorrent:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - flixbox_net

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: flixbox-bazarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      UMASK: ${UMASK:-002}
    volumes:
      - ${CONFIG_DIR}/bazarr:/config
      - ${DATA_DIR}:/data
    ports:
      - ${BAZARR_PORT:-6767}:6767
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - flixbox_net
