# Request portal (Seerr — successor to Jellyseerr/Overseerr).

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: flixbox-seerr
    init: true
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${SEERR_LOG_LEVEL:-info}
      PORT: 5055
    volumes:
      - ${CONFIG_DIR}/seerr:/app/config
    ports:
      - ${SEERR_PORT:-5055}:5055
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - flixbox_net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5055/api/v1/settings/public",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
