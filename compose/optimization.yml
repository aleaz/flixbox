# Post-process, quality sync, queue hygiene, library hygiene.
# Decluttarr qBit URL — always qbittorrent (ADR 0014; VPN alias on Gluetun).

services:
  unpackerr:
    image: ghcr.io/unpackerr/unpackerr:latest
    container_name: flixbox-unpackerr
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC}
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY:-}
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY:-}
      UN_FOLDER_0_PATH: /data/torrents
      UN_FOLDER_0_EXTRACT_PATH: ""
      UN_WEBSERVER_METRICS: "false"
    volumes:
      - ${DATA_DIR}:/data
      - ${CONFIG_DIR}/unpackerr:/config
    depends_on:
      qbittorrent:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - flixbox_net

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: flixbox-recyclarr
    profiles: ["recyclarr"]
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${CONFIG_DIR}/recyclarr:/config
    restart: "no"
    networks:
      - flixbox_net

  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest
    container_name: flixbox-decluttarr
    # Idle gate: templates/decluttarr/entrypoint.sh → ${CONFIG_DIR}/decluttarr-entrypoint.sh
    # (copied by flixbox init). Checks env at runtime — do not put secrets in Compose command.
    entrypoint: ["/bin/sh", "/flixbox-entrypoint.sh"]
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: INFO
      # Decluttarr v2 (Nov 2025): list-based instance config; v1 RADARR_URL/RADARR_KEY is ignored.
      TIMER: ${DECLUTTARR_REMOVE_TIMER:-10}
      max_strikes: ${DECLUTTARR_STRIKES:-5}
      PROTECTED_TAG: flixbox-keep
      REMOVE_FAILED_DOWNLOADS: "True"
      REMOVE_FAILED_IMPORTS: "True"
      REMOVE_METADATA_MISSING: "True"
      REMOVE_MISSING_FILES: "True"
      REMOVE_ORPHANS: "True"
      REMOVE_SLOW: |
        min_speed: ${DECLUTTARR_MIN_SPEED:-100}
      REMOVE_STALLED: "True"
      REMOVE_UNMONITORED: "False"
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
      RADARR: >
        - base_url: "http://radarr:7878"
          api_key: "${RADARR_API_KEY}"
      SONARR: >
        - base_url: "http://sonarr:8989"
          api_key: "${SONARR_API_KEY}"
      QBITTORRENT: >
        - base_url: "${DECLUTTARR_QBIT_URL:-http://qbittorrent:8080}"
          username: "${QBITTORRENT_USERNAME}"
          password: "${QBITTORRENT_PASSWORD}"
          name: "qBittorrent"
    volumes:
      - ${DATA_DIR}:/data
      - ${CONFIG_DIR:?set CONFIG_DIR}/decluttarr-entrypoint.sh:/flixbox-entrypoint.sh:ro
    depends_on:
      qbittorrent:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - flixbox_net

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: flixbox-maintainerr
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${CONFIG_DIR}/maintainerr:/opt/data
      - ${DATA_DIR}/media:/data/media
    ports:
      - ${MAINTAINERR_PORT:-6246}:6246
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - flixbox_net
