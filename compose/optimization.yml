# Post-process, quality sync, queue hygiene, library hygiene.
# Decluttarr qBit URL must match FLIXBOX_MODE (DECLUTTARR_QBIT_URL; set by flixbox init).

services:
  unpackerr:
    image: ghcr.io/unpackerr/unpackerr:latest
    container_name: flixbox-unpackerr
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC}
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY:-}
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY:-}
      UN_FOLDER_0_PATH: /data/torrents
      UN_FOLDER_0_EXTRACT_PATH: ""
      UN_WEBSERVER_METRICS: "false"
    volumes:
      - ${DATA_DIR}:/data
      - ${CONFIG_DIR}/unpackerr:/config
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - flixbox_net

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: flixbox-recyclarr
    profiles: ["recyclarr"]
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${CONFIG_DIR}/recyclarr:/config
    restart: "no"
    networks:
      - flixbox_net

  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest
    container_name: flixbox-decluttarr
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: INFO
      REMOVE_TIMER: ${DECLUTTARR_REMOVE_TIMER:-10}
      REMOVE_FAILED: "True"
      REMOVE_FAILED_IMPORTS: "True"
      REMOVE_METADATA_MISSING: "True"
      REMOVE_MISSING_FILES: "True"
      REMOVE_ORPHANS: "True"
      REMOVE_SLOW: "True"
      REMOVE_STALLED: "True"
      REMOVE_UNMONITORED: "False"
      PERMITTED_ATTEMPTS: ${DECLUTTARR_STRIKES:-5}
      MIN_DOWNLOAD_SPEED: ${DECLUTTARR_MIN_SPEED:-100}
      NO_STALLED_REMOVAL_QBIT_TAG: flixbox-keep
      RADARR_URL: http://radarr:7878
      RADARR_KEY: ${RADARR_API_KEY:-}
      SONARR_URL: http://sonarr:8989
      SONARR_KEY: ${SONARR_API_KEY:-}
      QBITTORRENT_URL: ${DECLUTTARR_QBIT_URL:-http://qbittorrent:8080}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
    volumes:
      - ${DATA_DIR}:/data
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - flixbox_net

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: flixbox-maintainerr
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${CONFIG_DIR}/maintainerr:/opt/data
      - ${DATA_DIR}/media:/data/media
    ports:
      - ${MAINTAINERR_PORT:-6246}:6246
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - flixbox_net
