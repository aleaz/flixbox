name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly image CVE refresh (docs/10-ci-plan.md §4.3)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose render (direct, vpn, profiles, access profiles)
        run: ./scripts/ci-compose-render.sh

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: ShellCheck
        run: |
          # -S warning: ignore info (SC2016 intentional literal greps, etc.)
          shellcheck -S warning -e SC1091 bin/flixbox scripts/*.sh scripts/lib/*.sh scripts/configure/*.sh \
            scripts/ci-validate.sh scripts/ci-smoke-init.sh scripts/ci-compose-render.sh \
            scripts/ci-trivy.sh scripts/ci-smoke-configure.sh scripts/ci-smoke-vpn.sh \
            scripts/ci-pin-digests.sh
          shellcheck -S warning templates/qbittorrent/custom-services.d/*.sh
          shellcheck -S warning templates/qbittorrent/flixbox-qbit-api-login.sh
          shellcheck -S warning templates/qbittorrent/custom-cont-init.d/*.sh
          shellcheck -S warning templates/decluttarr/entrypoint.sh

      - name: Contract validation
        run: ./scripts/ci-validate.sh

      - name: Init smoke (C-50–52 + env-file)
        run: ./scripts/ci-smoke-init.sh

      - name: VPN structural smoke (C-74)
        env:
          CI_VPN_SMOKE: "1"
        run: ./scripts/ci-smoke-vpn.sh

  configure-smoke-pr:
    name: configure-smoke-pr
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub login (optional — higher pull rate limit)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Configure PR subset (C-73)
        env:
          CI_CONFIGURE_SMOKE_PR: "1"
        run: ./scripts/ci-smoke-configure.sh

  configure-smoke:
    name: configure-smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub login (optional — higher pull rate limit)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Configure on ephemeral stack (C-70)
        env:
          CI_CONFIGURE_SMOKE: "1"
        run: ./scripts/ci-smoke-configure.sh

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq trivy

      - name: Trivy scan (warn-only)
        run: ./scripts/ci-trivy.sh
