name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-validate:
    name: release-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Contract validation
        run: ./scripts/ci-validate.sh

      - name: Configure smoke (full)
        env:
          CI_CONFIGURE_SMOKE: "1"
        run: ./scripts/ci-smoke-configure.sh

      - name: VPN structural smoke
        env:
          CI_VPN_SMOKE: "1"
        run: ./scripts/ci-smoke-vpn.sh

  release-security:
    name: release-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Trivy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq trivy

      # Assembler stack: pinned upstream images often carry CRITICAL OS/npm CVEs Flixbox
      # cannot patch. Scan still runs (CRITICAL + .trivyignore) but does not block the tag.
      # Tighten again when pins clear known CVEs or digest-pinning lands (docs/10-ci-plan.md).
      - name: Trivy scan (CRITICAL report; non-blocking for upstream images)
        env:
          TRIVY_BLOCK: "0"
          TRIVY_SEVERITY: "CRITICAL"
        run: ./scripts/ci-trivy.sh

  release-digests:
    name: release-digests
    runs-on: ubuntu-latest
    needs: [release-validate]
    steps:
      - uses: actions/checkout@v7

      - name: Record image digests
        run: ./scripts/ci-pin-digests.sh

      - name: Upload digest lock artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-digests
          path: compose/lock/digests.txt
