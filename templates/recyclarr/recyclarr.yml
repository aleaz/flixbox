# Recyclarr template — copied to ${CONFIG_DIR}/recyclarr/recyclarr.yml by init.
# Paste real API keys, then:
#   docker compose --profile recyclarr run --rm recyclarr sync
# Guide: https://recyclarr.dev/  and docs/09-hygiene-defaults.md

sonarr:
  series:
    base_url: http://sonarr:8989
    api_key: REPLACE_SONARR_API_KEY

radarr:
  movies:
    base_url: http://radarr:7878
    api_key: REPLACE_RADARR_API_KEY
