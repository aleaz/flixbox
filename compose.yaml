# Root Compose project.
#
# FLIXBOX_MODE=direct|vpn selects the downloader module.
# Optional profiles: plex, proxy, recyclarr, notifications, vpn-heal
#
#   cp .env.example .env && ./bin/flixbox init
#   docker compose up -d

name: flixbox

include:
  - path: compose/network-base.yml
  - path: compose/downloaders-${FLIXBOX_MODE:-direct}.yml
  - path: compose/servarr.yml
  - path: compose/optimization.yml
  - path: compose/media-servers.yml
  - path: compose/requests.yml
  - path: compose/dashboard.yml
  - path: compose/proxy.yml
  - path: compose/notifications.yml
  - path: compose/vpn-heal.yml
